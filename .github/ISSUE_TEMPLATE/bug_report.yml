name: Bug report
description: Something in OnTime is broken or unexpected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in as much as you can — macOS version and steps matter most.
  - type: input
    id: ontime-version
    attributes:
      label: OnTime version
      description: Settings → About, or the GitHub release tag / commit if building from source
      placeholder: e.g. 0.1.29 (1)
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.2 / 26.x
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How did you install OnTime?
      options:
        - GitHub Release (ZIP / DMG)
        - Built from source (Xcode)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Optional. Console messages, screenshots, or relevant lines from ~/Library/Application Support/OnTime/sessions.jsonl
    validations:
      required: false
