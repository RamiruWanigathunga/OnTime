name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    # Xcode 26 actool/ibtoold crashes on macOS 15 hosts (AssetCatalogAgent).
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26.1.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1.1"

      - name: Verify Xcode 26.1.1 is active
        run: |
          xcodebuild -version
          if ! xcodebuild -version | grep -q "Xcode 26.1.1"; then
            echo "Xcode 26.1.1 is not the active toolchain." >&2
            exit 1
          fi

      - name: Resolve version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Sparkle compares integer CFBundleVersion. Source of truth: xcodeproj
          # (bump CURRENT_PROJECT_VERSION for every public release).
          BUILD="$(sed -n 's/.*CURRENT_PROJECT_VERSION = \([0-9][0-9]*\);/\1/p' OnTime.xcodeproj/project.pbxproj | head -1)"
          if [[ -z "${BUILD}" ]]; then
            echo "Could not read CURRENT_PROJECT_VERSION from project.pbxproj" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build=${BUILD}" >> "${GITHUB_OUTPUT}"
          echo "Releasing OnTime ${VERSION} (build ${BUILD})"

      - name: Build app (ad-hoc via Xcode)
        run: |
          # CODE_SIGN_IDENTITY=- (like GitStreak): Xcode re-seals Sparkle after
          # stripping headers so Gatekeeper won't call the app "damaged".
          xcodebuild \
            -project OnTime.xcodeproj \
            -scheme OnTime \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.meta.outputs.build }}"

      - name: Package ZIP + DMG
        id: package
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          APP="build/Build/Products/Release/OnTime.app"
          if [[ ! -d "${APP}" ]]; then
            echo "Built app not found at ${APP}" >&2
            find build -name 'OnTime.app' -type d 2>/dev/null || true
            exit 1
          fi
          mkdir -p dist
          ZIP="dist/OnTime-v${VERSION}.zip"
          DMG="dist/OnTime-v${VERSION}.dmg"

          # With CODE_SIGN_IDENTITY="-", Xcode already ad-hoc signed the app and
          # re-sealed Sparkle after stripping Headers (same as GitStreak). Do not
          # copy headers back — that invalidates the seal. Never codesign --deep.
          codesign --verify --deep --strict --verbose=2 "${APP}"
          codesign -dv --verbose=2 "${APP}" 2>&1 | tee /tmp/ontime-codesign.txt
          if ! grep -q 'Signature=adhoc' /tmp/ontime-codesign.txt; then
            echo "Expected ad-hoc signature on OnTime.app" >&2
            exit 1
          fi
          echo "Xcode ad-hoc signature verified (Sparkle re-sealed by build)."

          ditto -c -k --sequesterRsrc --keepParent "${APP}" "${ZIP}"
          bash scripts/make-dmg.sh "${APP}" "${DMG}"
          ls -lh "${ZIP}" "${DMG}"
          echo "zip=${ZIP}" >> "${GITHUB_OUTPUT}"
          echo "dmg=${DMG}" >> "${GITHUB_OUTPUT}"
          echo "zip_bytes=$(stat -f%z "${ZIP}")" >> "${GITHUB_OUTPUT}"

      - name: Sign ZIP for Sparkle
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "${SPARKLE_PRIVATE_KEY}" ]]; then
            echo "SPARKLE_PRIVATE_KEY secret is not set." >&2
            echo "Export with Sparkle generate_keys -x and:" >&2
            echo "  gh secret set SPARKLE_PRIVATE_KEY < ed25519-private.pem" >&2
            exit 1
          fi
          SIGN_UPDATE="$(find build/SourcePackages -path '*/Sparkle/bin/sign_update' -type f | head -1)"
          if [[ -z "${SIGN_UPDATE}" || ! -x "${SIGN_UPDATE}" ]]; then
            echo "sign_update not found under build/SourcePackages" >&2
            find build/SourcePackages -name sign_update 2>/dev/null || true
            exit 1
          fi
          KEY_FILE="$(mktemp)"
          printf '%s\n' "${SPARKLE_PRIVATE_KEY}" > "${KEY_FILE}"
          # -p prints signature only; full output includes length= for appcast.
          FULL="$("${SIGN_UPDATE}" --ed-key-file "${KEY_FILE}" "${{ steps.package.outputs.zip }}")"
          rm -f "${KEY_FILE}"
          echo "${FULL}"
          SIG="$(echo "${FULL}" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p' | head -1)"
          if [[ -z "${SIG}" ]]; then
            # Newer sign_update may print: sparkle:edSignature="..." length="..."
            SIG="$(echo "${FULL}" | grep -oE '[A-Za-z0-9+/=]{40,}' | head -1)"
          fi
          if [[ -z "${SIG}" ]]; then
            echo "Could not parse EdDSA signature from sign_update output." >&2
            exit 1
          fi
          echo "ed_signature=${SIG}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OnTime ${{ steps.meta.outputs.version }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.dmg }}
          body: |
            ## OnTime ${{ steps.meta.outputs.version }}

            Privacy-first menu-bar timer for macOS — natural-language countdowns, Pomodoro, stopwatch, stretch-to-set, Shortcuts / App Intents, and local session logging. No accounts, no cloud.

            ### Install

            **Preferred:** download **`OnTime-v${{ steps.meta.outputs.version }}.dmg`**, open it, drag **OnTime** into **Applications**.

            Or use **`OnTime-v${{ steps.meta.outputs.version }}.zip`** (also used by in-app Sparkle updates).

            > [!IMPORTANT]
            > **Gatekeeper (ad-hoc / non-notarized build)**
            >
            > Not notarized with a paid Apple Developer ID. After a browser download:
            >
            > 1. Drag **OnTime** to `/Applications` before opening (don’t launch from the DMG).
            > 2. If you see *“is damaged”* or *“could not verify”*:
            >    `xattr -cr /Applications/OnTime.app && open /Applications/OnTime.app`
            > 3. Or **System Settings → Privacy & Security → Open Anyway** / right-click → **Open**.

            ### Requirements

            macOS 14 (Sonoma) or later.

            ### Updates

            Installed copies can use **Settings → About → Check for Updates…** (Sparkle). Background checks stay off until you enable them in a later build.

      - name: Update appcast on main
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          ZIP_BYTES: ${{ steps.package.outputs.zip_bytes }}
          ED_SIG: ${{ steps.sparkle.outputs.ed_signature }}
        run: |
          ZIP_URL="https://github.com/RamiruWanigathunga/OnTime/releases/download/v${VERSION}/OnTime-v${VERSION}.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          python3 scripts/update_appcast.py \
            appcast.xml \
            "${VERSION}" \
            "${BUILD}" \
            "${ZIP_URL}" \
            "${ZIP_BYTES}" \
            "${ED_SIG}"
          if git diff --quiet appcast.xml; then
            echo "appcast.xml unchanged"
            exit 0
          fi
          git add appcast.xml
          git commit -m "chore: appcast for v${VERSION}"
          git push origin main
