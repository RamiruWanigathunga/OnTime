name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    # Xcode 26 actool/ibtoold crashes on macOS 15 hosts (AssetCatalogAgent).
    # Use macos-26 so the .icon / asset catalog compile matches the toolchain.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.1.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1.1"

      - name: Verify Xcode 26.1.1 is active
        run: |
          xcodebuild -version
          if ! xcodebuild -version | grep -q "Xcode 26.1.1"; then
            echo "Xcode 26.1.1 is not the active toolchain." >&2
            exit 1
          fi

      - name: Build app (unsigned)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild \
            -project OnTime.xcodeproj \
            -scheme OnTime \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION=1

      - name: Package ZIP
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="build/Build/Products/Release/OnTime.app"
          if [[ ! -d "${APP}" ]]; then
            echo "Built app not found at ${APP}" >&2
            find build -name 'OnTime.app' -type d 2>/dev/null || true
            exit 1
          fi
          mkdir -p dist
          ZIP="dist/OnTime-v${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP}" "${ZIP}"
          ls -lh "${ZIP}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "zip=${ZIP}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OnTime ${{ steps.package.outputs.version }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          files: ${{ steps.package.outputs.zip }}
          body: |
            ## OnTime ${{ steps.package.outputs.version }}

            Privacy-first menu-bar timer for macOS — natural-language countdowns, Pomodoro, stopwatch, stretch-to-set, Shortcuts / App Intents, and local session logging. No accounts, no cloud.

            ### Install

            1. Download **`OnTime-v${{ steps.package.outputs.version }}.zip`** from Assets below.
            2. Unzip, then drag **`OnTime.app`** into **Applications**.
            3. Launch OnTime from `/Applications`.

            > [!IMPORTANT]
            > **Gatekeeper (unsigned / non-notarized build)**
            >
            > This release is not notarized with a paid Apple Developer ID. On first launch macOS may show *“Apple could not verify OnTime”*:
            >
            > 1. Prefer dragging the app to `/Applications` before opening it.
            > 2. Open **System Settings → Privacy & Security**, then **Open Anyway**, or right-click the app → **Open** → **Open**.

            ### Requirements

            macOS 14 (Sonoma) or later.

            ### Links

            - Repository: https://github.com/RamiruWanigathunga/OnTime
            - Docs: [README](https://github.com/RamiruWanigathunga/OnTime#readme) · [RELEASING](https://github.com/RamiruWanigathunga/OnTime/blob/main/RELEASING.md)

            In-app Sparkle updates will light up once the first EdDSA-signed appcast item is published (see RELEASING.md).
